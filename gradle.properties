# Windows ACP 为 GBK 时，Gradle 守护进程必须用系统编码写 test worker 的 classpath argfile，
# 否则中文路径会被写成 UTF-8 字节、再被 launcher 按 GBK 读取，导致测试类 ClassNotFoundException。
# 源码/测试运行仍由 Kotlin 编译器和 test.defaultCharacterEncoding 统一为 UTF-8。
org.gradle.jvmargs=-Xmx3072m
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
# 工程目录含非 ASCII 字符时 AGP 默认拒绝构建，这里显式放行；纯 Kotlin/Java 工程，不涉及 NDK。
android.overridePathCheck=true
android.nonTransitiveRClass=true
kotlin.code.style=official
